<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profil du Professeur</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h2>Mon Profil</h2>
            <p>Informations personnelles et professionnelles</p>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>Détails du Professeur</h3>
            </div>
            <div class="card-body" th:if="${professeur != null}">
                <div class="profile-info">
                    <div class="profile-item">
                        <strong>Nom Complet:</strong> <span th:text="${professeur.nom + ' ' + professeur.prenom}"></span>
                    </div>
                    <div class="profile-item">
                        <strong>Matricule:</strong> <span th:text="${professeur.matricule}"></span>
                    </div>
                    <div class="profile-item">
                        <strong>Spécialité:</strong> <span th:text="${professeur.specialite}"></span>
                    </div>
                    <div class="profile-item">
                        <strong>Téléphone:</strong> <span th:text="${professeur.telephone}"></span>
                    </div>
                    <div class="profile-item">
                        <strong>Adresse:</strong> <span th:text="${professeur.adresse}"></span>
                    </div>
                    <div class="profile-item">
                        <strong>Type de Contrat:</strong> <span th:text="${professeur.typeContrat}"></span>
                    </div>
                    <div class="profile-item">
                        <strong>Date de Naissance:</strong> <span th:text="${#temporals.format(professeur.dateNaissance, 'dd/MM/yyyy')}"></span>
                    </div>
                </div>
            </div>
            <div class="card-body" th:if="${professeur == null}">
                <p class="text-danger">Impossible de charger le profil du professeur. Veuillez contacter l'administrateur.</p>
            </div>
        </div>
    </div>
</body>
</html>
