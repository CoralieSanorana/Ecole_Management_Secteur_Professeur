<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestion des Devoirs et Cours</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"> <!-- Assurez-vous que le chemin est correct -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <div>
                <h2>Supports de Cours & Devoirs</h2>
                <p>Gérez vos publications par classe</p>
            </div>
            <button class="btn btn-primary" onclick="formCours()"><i class="fas fa-plus"></i> Nouveau Support</button>
        </div>

        <div class="grid-2">
            <!-- Section 1: Liste des Classes assignées -->
            <div>
                <h4 class="mb-3">Mes Classes Assignées</h4>
                <div class="card">
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Classe</th>
                                    <th>Matière</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="aff : ${affectations}">
                                    <td th:text="${aff.classe.nom}">Classe</td>
                                    <td th:text="${aff.matiere.nom}">Matière</td>
                                    <td>
                                        <a th:href="@{/professeur/devoirs(affectationId=${aff.id})}" class="btn btn-sm btn-info">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Section 2: Liste des cours publiés -->
            <div>
                <h4 class="mb-3" th:text="${selectedClasse != null} ? 'Publications pour ' + ${selectedClasse.classe.nom} : 'Sélectionnez une classe'">Publications</h4>
                <div th:if="${supports != null}" style="display:flex; flex-direction:column; gap:15px;">
                    <div th:each="s : ${supports}" class="card p-3">
                        <div style="display:flex; justify-content:space-between; align-items:start;">
                            <h4 th:text="${s.titre}">Titre</h4>
                            <span th:class="${s.typeContenu == 'devoir'} ? 'badge badge-amber' : 'badge badge-navy'" th:text="${s.typeContenu}">Type</span>
                        </div>
                        <p class="due" th:if="${s.dateLimite != null}">
                            📅 À rendre : <span th:text="${#temporals.format(s.dateLimite, 'dd/MM/yyyy HH:mm')}"></span>
                        </p>
                        <div class="mt-2">
                            <a th:href="${s.urlFichier}" class="btn btn-sm btn-secondary" target="_blank"><i class="fas fa-download"></i> Télécharger</a>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(supports)}" class="text-center p-4 card">
                        <p>Aucun support publié pour cette classe.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulaire de publication (Masqué par défaut) -->
        <section id="form-container" class="card mt-4" style="display: none;">
            <div class="card-header"><h3>Publier un nouveau support</h3></div>
            <form th:action="@{/professeur/devoirs/save}" method="post" enctype="multipart/form-data" class="p-3">
                <div class="form-row">
                    <div class="form-group">
                        <label>Classe & Matière concernée</label>
                        <select name="affectation.id" class="form-control" required>
                            <option th:each="aff : ${affectations}" th:value="${aff.id}" th:text="${aff.classe.nom} + ' - ' + ${aff.matiere.nom}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Titre :</label>
                        <input type="text" name="titre" class="form-control" placeholder="Ex: Chapitre 1 - Introduction" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Type de contenu :</label>
                        <select name="typeContenu" class="form-control" id="typeContenu" onchange="toggleDevoirFields()">
                            <option value="cours">Cours</option>
                            <option value="devoir">Devoir</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Format du fichier :</label>
                        <select name="typeFichier.id" class="form-control">
                            <option th:each="tf : ${typesFichiers}" th:value="${tf.id}" th:text="${tf.nom}"></option>
                        </select>
                    </div>
                </div>

                <div id="devoir-fields" style="display: none;">
                    <div class="form-group">
                        <label>Date limite :</label>
                        <input type="datetime-local" name="dateLimite" class="form-control">
                    </div>
                    <div class="form-check mt-3">
                        <input type="checkbox" name="accepteRetard" class="form-check-input" id="retard">
                        <label class="form-check-label" for="retard">Accepter les retards</label>
                    </div>
                </div>

                <div class="form-group mt-3">
                    <label>Fichier :</label>
                    <input type="file" name="file" class="form-control" required>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-success"><i class="fas fa-paper-plane"></i> Publier Support</button>
                    <button type="button" class="btn btn-secondary" onclick="formCours()">Annuler</button>
                </div>
            </form>
        </section>
    </div>

    <script>
        function formCours() {
            const container = document.getElementById('form-container');
            container.style.display = container.style.display === 'none' ? 'block' : 'none';
        }

        function toggleDevoirFields() {
            const type = document.getElementById('typeContenu').value;
            document.getElementById('devoir-fields').style.display = type === 'devoir' ? 'block' : 'none';
        }
    </script>
</body>
</html>
