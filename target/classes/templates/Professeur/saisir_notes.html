    <div class="page-header">
        <div><h2>Saisir des Notes</h2><p>Saisie des notes pour une évaluation</p></div>
        <div class="page-header-actions">
          <a th:href="@{/professeur/notes/{classeId}/{matiereId}(classeId=${classeId}, matiereId=${matiereId})}" 
             class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Retour aux notes
          </a>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Informations de l'évaluation</h3>
        </div>
        <form th:action="@{/professeur/saisir_notes/{classeId}/{matiereId}(classeId=${classeId}, matiereId=${matiereId})}" 
              method="post" 
              class="form">
          <div class="form-row">
            <div class="form-group">
              <label>Type d'évaluation</label>
              <select name="typeEvaluation" class="form-control" required>
                <option value="">Sélectionner...</option>
                <option value="Devoir">Devoir</option>
                <option value="Interrogation">Interrogation</option>
                <option value="Examen">Examen</option>
                <option value="TP">TP</option>
              </select>
            </div>
            <div class="form-group">
              <label>Période</label>
              <select name="periode" class="form-control" required>
                <option value="">Sélectionner...</option>
                <option value="1">1er Trimestre</option>
                <option value="2">2ème Trimestre</option>
                <option value="3">3ème Trimestre</option>
              </select>
            </div>
            <div class="form-group">
              <label>Barème (/)</label>
              <input type="number" name="sur" class="form-control" value="20" min="1" required/>
            </div>
          </div>

          <div class="card-header" style="margin-top: 20px;">
            <h3>Notes des élèves</h3>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Élève</th>
                  <th>Matricule</th>
                  <th>Note (/20)</th>
                  <th>Commentaire</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="inscription, stat : ${inscriptions}">
                  <td th:text="${etudiantsMap.get(inscription.etudiantId)?.nom + ' ' + etudiantsMap.get(inscription.etudiantId)?.prenom}">Nom Prénom</td>
                  <td th:text="${etudiantsMap.get(inscription.etudiantId)?.matricule}">Matricule</td>
                  <td>
                    <input type="number" name="valeurs" 
                           class="form-control" 
                           min="0" 
                           max="20" 
                           step="0.5"
                           style="width: 80px;"
                           required/>
                    <input type="hidden" name="etudiantIds" th:value="${inscription.etudiantId}"/>
                  </td>
                  <td>
                    <input type="text" name="commentaires" class="form-control" placeholder="Note..."/>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="form-actions" style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i> Enregistrer les notes
            </button>
            <a th:href="@{/professeur/notes/{classeId}/{matiereId}(classeId=${classeId}, matiereId=${matiereId})}" 
               class="btn btn-secondary">
              Annuler
            </a>
          </div>
        </form>
      </div>
