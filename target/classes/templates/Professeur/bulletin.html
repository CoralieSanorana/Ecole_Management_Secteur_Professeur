<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>
<canvas id="particle-canvas"></canvas>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" th:replace="fragments/header :: sidebar"></aside>
  <header class="topbar" th:replace="fragments/header :: topbar"></header>
  <main class="main-content">
    <div class="page-header">
        <div><h2>Gestion des Bulletins</h2><p>Consultation des bilans de performance</p></div>
    </div>
      
    <div class="card">
      <div class="card-header" th:if="${classe != null}">
        <h3 th:text="'Classe dont vous êtes titulaire : ' + ${classe.nom}">Classe</h3>
      </div>
      
      <div class="card-body" th:if="${classe == null}">
        <p class="text-muted">Vous n'êtes assigné à aucune classe titulaire pour l'année en cours.</p>
      </div>

      <div th:if="${classe != null}" style="padding: 15px; border-bottom: 1px solid var(--border-color, #eef2f5);">
        <form method="GET" th:action="@{/professeur/bulletins}" style="display: flex; gap: 10px; max-width: 500px;">
          <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Rechercher un élève (Nom, prénom, matricule)..." style="flex: 1; padding: 8px 12px;">
          <button type="submit" class="btn btn-primary">Rechercher</button>
          <a th:if="${search != null && !search.isEmpty()}" th:href="@{/professeur/bulletins}" class="btn btn-secondary">Réinitialiser</a>
        </form>
      </div>

      <div class="table-wrapper" th:if="${inscriptions != null && !inscriptions.isEmpty()}">
        <table id="bulletinsTable">
          <thead>
            <tr>
              <th style="cursor: pointer; user-select: none;" onclick="sortBulletinsTable(0)">
                Élève <i class="fas fa-sort text-muted ms-1"></i>
              </th>
              <th style="cursor: pointer; user-select: none;" onclick="sortBulletinsTable(1)">
                Matricule <i class="fas fa-sort text-muted ms-1"></i>
              </th>
              <th style="text-align: center;">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="inscription : ${inscriptions}">
              <td>
                <strong class="student-text" th:text="${etudiantProfiles.get(inscription.etudiantId) != null ? etudiantProfiles.get(inscription.etudiantId).nom + ' ' + etudiantProfiles.get(inscription.etudiantId).prenom : 'Étudiant'}">Nom Prénom</strong>
              </td>
              <td>
                <span class="student-matricule" th:text="${etudiantProfiles.get(inscription.etudiantId) != null ? etudiantProfiles.get(inscription.etudiantId).matricule : ''}">MAT-123</span>
              </td>
              <td style="text-align: center;">
                <a th:href="@{/professeur/bulletin/{etudiantId}(etudiantId=${inscription.etudiantId})}" class="btn btn-sm btn-primary">
                  <i class="fas fa-eye"></i> Voir le Bulletin
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="card-footer" th:if="${totalPages > 1}" style="display: flex; justify-content: center; padding: 15px; border-top: 1px solid var(--border-color, #eef2f5);">
        <ul class="pagination" style="display: flex; list-style: none; gap: 5px; padding: 0; margin: 0;">
          <li th:class="${currentPage <= 1} ? 'disabled' : ''">
            <a th:href="@{/professeur/bulletins(page=${currentPage - 1}, search=${search})}" class="btn btn-secondary btn-sm" th:style="${currentPage <= 1} ? 'pointer-events: none; opacity: 0.5;' : ''">Précédent</a>
          </li>
          <li th:each="i : ${#numbers.sequence(1, totalPages)}" th:class="${i == currentPage} ? 'active' : ''">
            <a th:href="@{/professeur/bulletins(page=${i}, search=${search})}" 
               th:text="${i}" 
               class="btn btn-sm" 
               th:style="${i == currentPage} ? 'background-color: var(--primary); color: white;' : 'background-color: transparent; border: 1px solid #ccc;'">1</a>
          </li>
          <li th:class="${currentPage >= totalPages} ? 'disabled' : ''">
            <a th:href="@{/professeur/bulletins(page=${currentPage + 1}, search=${search})}" class="btn btn-secondary btn-sm" th:style="${currentPage >= totalPages} ? 'pointer-events: none; opacity: 0.5;' : ''">Suivant</a>
          </li>
        </ul>
      </div>

      <div th:if="${inscriptions != null}" style="text-align: center; color: var(--txt3); padding-bottom: 15px; font-size: 0.9em;">
        Total : <span th:text="${totalRows}">0</span> élève(s) trouvé(s)
      </div>
    </div>
  </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>

<script>
let currentSortCol = -1;
let sortAscending = true;

function sortBulletinsTable(columnIndex) {
    const table = document.getElementById("bulletinsTable");
    if (!table) return;
    
    const tbody = table.querySelector("tbody");
    const rows = Array.from(tbody.querySelectorAll("tr"));
    
    if (currentSortCol === columnIndex) {
        sortAscending = !sortAscending;
    } else {
        sortAscending = true;
        currentSortCol = columnIndex;
    }

    const headers = table.querySelectorAll("thead th");
    headers.forEach((th, idx) => {
        const icon = th.querySelector("i");
        if (icon) {
            if (idx === columnIndex) {
                icon.className = sortAscending ? "fas fa-sort-up text-primary ms-1" : "fas fa-sort-down text-primary ms-1";
            } else {
                icon.className = "fas fa-sort text-muted ms-1";
            }
        }
    });

    rows.sort((rowA, rowB) => {
        let elA = rowA.cells[columnIndex];
        let elB = rowB.cells[columnIndex];
        
        if (columnIndex === 0) { elA = elA.querySelector('.student-text'); elB = elB.querySelector('.student-text'); }
        else if (columnIndex === 1) { elA = elA.querySelector('.student-matricule'); elB = elB.querySelector('.student-matricule'); }

        const txtA = elA ? elA.innerText.trim().toLowerCase() : rowA.cells[columnIndex].innerText.trim().toLowerCase();
        const txtB = elB ? elB.innerText.trim().toLowerCase() : rowB.cells[columnIndex].innerText.trim().toLowerCase();
        
        return sortAscending ? txtA.localeCompare(txtB) : txtB.localeCompare(txtA);
    });

    rows.forEach(row => tbody.appendChild(row));
}
</script>
</body>
</html>
