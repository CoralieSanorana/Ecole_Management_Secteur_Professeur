    <div class="page-header">
        <div><h2>Notes des Élèves</h2><p>Saisie et gestion des notes</p></div>
        <div class="page-header-actions">
          <a th:href="@{/professeur/saisir_notes/{classeId}/{matiereId}(classeId=${classeId}, matiereId=${matiereId})}" 
             class="btn btn-primary" 
             th:if="${classeId != null}">
            <i class="fas fa-plus"></i> Saisir des notes
          </a>
        </div>
      </div>

      <!-- Section: Liste des classes du professeur -->
      <div class="card" th:if="${classeId == null}">
        <div class="card-header">
          <h3>Mes Classes</h3>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Classe</th>
                <th>Matière</th>
                <th>Heures hebdo</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="affectation : ${affectations}">
                <td th:text="${affectation.classeId}">Classe ID</td>
                <td th:text="${affectation.matiereId}">Matière ID</td>
                <td th:text="${affectation.heuresHebdo}">Heures</td>
                <td>
                  <a th:href="@{/professeur/notes/{classeId}/{matiereId}(classeId=${affectation.classeId}, matiereId=${affectation.matiereId})}" 
                     class="btn btn-sm btn-primary">
                    Voir les élèves
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Section: Liste des étudiants et leurs notes (quand une classe est sélectionnée) -->
      <div class="card" th:if="${classeId != null}">
        <div class="card-header">
          <h3>Élèves de la classe <span th:text="${classeId}"></span></h3>
          <a th:href="@{/professeur/notes}" class="btn btn-sm btn-secondary">
            <i class="fas fa-arrow-left"></i> Retour aux classes
          </a>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Élève</th>
                <th>Matricule</th>
                <th>Notes</th>
                <th>Moyenne</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="inscription : ${inscriptions}">
                <td th:text="${etudiantsMap.get(inscription.etudiantId)?.nom + ' ' + etudiantsMap.get(inscription.etudiantId)?.prenom}">Nom Prénom</td>
                <td th:text="${etudiantsMap.get(inscription.etudiantId)?.matricule}">Matricule</td>
                <td>
                  <span th:each="note : ${notesMap.get(inscription.etudiantId)}" 
                        th:text="${note.typeEvaluation + ': ' + note.valeur + '/' + note.sur + ' '}">
                    Note
                  </span>
                  <span th:if="${notesMap.get(inscription.etudiantId) == null or notesMap.get(inscription.etudiantId).isEmpty()}" 
                        class="text-muted">
                    Aucune note
                  </span>
                </td>
                <td>
                  <!-- Calcul de la moyenne (à implémenter) -->
                  <span class="text-muted">--</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
